name: Execução Agendada de Testes Unitários

on:
  schedule:
    - cron: '*/5 * * * *' # Executa a cada 5 minutos
  workflow_dispatch: # Mantém a opção de executar manualmente para testes

jobs:
  test:
    name: Executar Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar os Testes
        run: npm test
